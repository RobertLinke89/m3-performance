<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="M³ Performance – Ganzheitliches Personal Training, das Stoffwechsel (M¹), Biomechanik (M²) und Mindset (M³) vereint. Leistung beginnt mit Gesundheit."
    />
    <title>M³ Performance – Personal Training & Gesundheit</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/images/hero-system-mobile.webp" type="image/webp" media="(max-width: 860px)" />
    <link rel="preload" as="image" href="/images/hero-system.webp" type="image/webp" media="(min-width: 861px)" />
    <script>
      (function () {
        var stored = localStorage.getItem('m3-theme')
        var migrated = localStorage.getItem('m3-theme-default')
        var theme = 'day'
        if (!migrated) {
          theme = stored === 'night' ? 'night' : 'day'
        } else if (stored === 'day' || stored === 'night') {
          theme = stored
        } else if (stored === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
