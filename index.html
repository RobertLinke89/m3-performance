<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="M³ Performance – Ganzheitliches Personal Training, das Stoffwechsel (M¹), Biomechanik (M²) und Mindset (M³) vereint. Leistung beginnt mit Gesundheit."
    />
    <title>M³ Performance – Personal Training & Gesundheit</title>
    <link rel="preload" as="image" href="/images/hero-food.webp" type="image/webp" />
    <script>
      (function () {
        var stored = localStorage.getItem('m3-theme')
        var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day'
        document.documentElement.dataset.theme =
          stored === 'day' || stored === 'night' ? stored : system
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
